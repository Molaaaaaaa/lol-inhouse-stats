# Cloudflare Workers — 정적 사이트
#
# 정적 파일(index.html, data/*.json, riot.txt)은 [assets]가 서빙한다. worker.js 는 헤더만 붙인다.
#   대시보드 Build command 는 비우고, Deploy command 는 `npx wrangler deploy`.
#   (피드백 창구와 FEEDBACK_WEBHOOK 시크릿은 2026-09-03 제거.)
#
# ⚠️ riot.txt 는 루트(/riot.txt)로 그대로 서빙돼야 한다 — 라이엇 도메인 검증용.

name = "lol-inhouse-stats"
main = "worker.js"
compatibility_date = "2026-07-01"

[assets]
directory = "."
binding = "ASSETS"
# 없는 경로는 404 (SPA가 아니므로 index.html로 되돌리지 않는다)
not_found_handling = "none"
