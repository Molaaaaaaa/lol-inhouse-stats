# Cloudflare Workers — 정적 사이트
#
# 정적 파일(index.html, data/*.json, riot.txt)은 [assets]가 서빙한다. worker.js 는 헤더만 붙인다.
#   대시보드 Build command 는 비우고, Deploy command 는 `npx wrangler deploy`.
#   피드백 창구(/api/feedback → worker.js)는 2026-10-01 에 되살렸다. 받는 곳은 **디스코드 웹훅** 하나이고,
#   URL 은 브라우저로 안 나간다 — Cloudflare 시크릿에만 둔다:
#     npx wrangler secret put FEEDBACK_WEBHOOK      (값: 디스코드 채널 웹훅 URL)
#   시크릿이 없으면 503 + 화면은 GitHub Issues 안내로 물러난다(아무 데도 안 쌓인다).
#
# ⚠️ riot.txt 는 루트(/riot.txt)로 그대로 서빙돼야 한다 — 라이엇 도메인 검증용.

name = "lol-inhouse-stats"
main = "worker.js"
compatibility_date = "2026-07-01"

[assets]
directory = "."
binding = "ASSETS"
# 없는 경로는 404 (SPA가 아니므로 index.html로 되돌리지 않는다)
not_found_handling = "none"
